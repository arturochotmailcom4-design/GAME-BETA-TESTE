name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Montar projeto a partir dos zips
        run: |
          mkdir proj
          for z in projeto-*.zip; do unzip -q -o "$z" -d proj; done
          ls proj proj/app/src/main/assets/www | head -20
      - name: Corrigir MainActivity
        run: |
          cat > proj/app/src/main/java/com/newjazz/app/MainActivity.java <<'EOF'
          package com.newjazz.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
            WebView w;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, String u) {
                  if (u.startsWith("http")) {
                    startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u)));
                    return true;
                  }
                  return false;
                }
              });
              w.setBackgroundColor(0xFF07091A);
              w.loadUrl("file:///android_asset/www/index.html");
              hide();
            }

            void hide() {
              getWindow().getDecorView().setSystemUiVisibility(4 | 2 | 4096 | 1024);
            }

            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hide();
            }

            @Override
            protected void onPause() {
              super.onPause();
              w.onPause();
            }

            @Override
            protected void onResume() {
              super.onResume();
              w.onResume();
            }
          }
          EOF
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NewJazz-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
