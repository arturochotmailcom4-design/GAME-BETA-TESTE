name: Gerar APK
on:
  push:
  workflow_dispatch:
  release:
    types: [published, edited]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Baixar o jogo da Release "jogo"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download jogo --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --clobber || true
          ls -la *.zip 2>/dev/null || true
          if ! ls NewJazz_*.zip >/dev/null 2>&1; then
            echo "::error::Nao achei o NewJazz_completo.zip. Crie a Release com a tag 'jogo' e anexe o zip."
            exit 1
          fi

      - name: Criar o projeto Android
        run: |
          mkdir -p proj/app/src/main/java/com/newjazz/app proj/app/src/main/assets/www proj/app/src/main/res/drawable proj/app/src/main/res/values
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "NewJazz"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.newjazz.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.newjazz.app'
              minSdk 24
              targetSdk 34
              versionCode 402
              versionName '402'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            androidResources { noCompress += ['mp3', 'webp'] }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="New Jazz"
              android:icon="@drawable/icone"
              android:hardwareAccelerated="true"
              android:usesCleartextTraffic="true"
              android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/newjazz/app/MainActivity.java <<'EOF'
          package com.newjazz.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            WebView w;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, String u) {
                  if (u.startsWith("http")) {
                    startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u)));
                    return true;
                  }
                  return false;
                }
              });
              w.setBackgroundColor(0xFF07091A);
              w.loadUrl("file:///android_asset/www/index.html");
              hide();
            }

            void hide() {
              getWindow().getDecorView().setSystemUiVisibility(4 | 2 | 4096 | 1024 | 512 | 256);
            }

            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hide();
            }

            @Override
            public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }

            @Override
            protected void onPause() { super.onPause(); w.onPause(); }

            @Override
            protected void onResume() { super.onResume(); w.onResume(); }
          }
          EOF

      - name: Colocar o jogo dentro do APK
        run: |
          for z in NewJazz_*.zip; do unzip -q -o "$z" -d proj/app/src/main/assets/www; done
          W=proj/app/src/main/assets/www
          # se o zip tiver uma pasta extra por dentro, sobe o conteúdo
          if [ ! -f $W/index.html ]; then
            d=$(dirname "$(find $W -name index.html | head -1)")
            [ -n "$d" ] && cp -r "$d"/. $W/
          fi
          test -f $W/index.html
          cp $W/a/surf.webp proj/app/src/main/res/drawable/icone.webp
          echo "imagens: $(ls $W/a | wc -l) · radio: $(ls $W/radio 2>/dev/null | wc -l)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NewJazz-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
